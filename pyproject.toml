[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskdeck"
version = "0.1.0"
description = "Complete desk profiles for a shared Dell monitor and Deskflow"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
tray = ["pystray==0.19.5", "Pillow==13.0.0"]

[project.scripts]
deskdeck = "deskdeck.cli:main"
deskdeck-tray = "deskdeck.tray:main"

[tool.setuptools.package-data]
deskdeck = ["static/*"]
