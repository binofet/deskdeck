[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskdeck"
version = "0.1.0"
description = "Complete desk profiles for a shared Dell monitor and Deskflow"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
deskdeck = "deskdeck.cli:main"

[tool.setuptools.package-data]
deskdeck = ["static/*"]
